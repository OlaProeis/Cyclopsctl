[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyclopsctl"
version = "0.1.0"
description = "CLI orchestration layer for Cursor agent runs with native task queue and file-based handovers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "cursor-sdk>=0.1.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cyclopsctl = "cyclopsctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cyclopsctl"]

[tool.hatch.build.targets.wheel.force-include]
"src/cyclopsctl/templates" = "cyclopsctl/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

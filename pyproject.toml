[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyclopsctl"
version = "0.1.5"
description = "Cursor task orchestrator CLI — orchestrate agent implement/update cycles, PRD bootstrap, model routing, and handover verification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "cursor-sdk>=0.1.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cyclopsctl = "cyclopsctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cyclopsctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
